name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, work-v1.0.22, work-v1.0.23, work-v1.0.24, work-v1.0.25, work-v1.0.26, work-v1.0.27, work-v1.0.28]
    paths: ["app.config.ts","eas.json","package.json","pnpm-lock.yaml","plugins/**","native/**","app/**","components/**","lib/**",".github/workflows/android-apk.yml"]
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9.12.0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - run: npx expo prebuild --platform android --no-install --clean
      - run: cd android && ./gradlew :app:assembleRelease --no-daemon
      - id: app_version
        shell: bash
        run: |
          VERSION=$(grep -o 'version:"[^"]*"' app.config.ts | head -1 | cut -d'"' -f2)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: cp android/app/build/outputs/apk/release/app-release.apk "time-machine-${{ steps.app_version.outputs.version }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: Машина времени v${{ steps.app_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: time-machine-${{ steps.app_version.outputs.version }}.apk
          generate_release_notes: true
          overwrite_files: true
