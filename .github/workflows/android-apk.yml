name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "plugins/**"
      - "native/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Enable release shrinking
        run: printf '\nandroid.enableMinifyInReleaseBuilds=true\nandroid.enableShrinkResourcesInReleaseBuilds=true\n' >> android/gradle.properties
      - name: Build release APK
        run: cd android && ./gradlew :app:assembleRelease --no-daemon
      - name: Read app version
        id: app_version
        run: |
          VERSION=$(node scripts/app-version.mjs | node -pe 'JSON.parse(fs.readFileSync(0,"utf8")).version')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Prepare APK file
        run: cp android/app/build/outputs/apk/release/app-release.apk "time-machine-${{ steps.app_version.outputs.version }}.apk"
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: Машина времени v${{ steps.app_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: time-machine-${{ steps.app_version.outputs.version }}.apk
          generate_release_notes: true
          overwrite_files: false
