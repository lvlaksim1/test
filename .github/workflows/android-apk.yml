name: Android APK




on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.config.ts"
      - "eas.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "plugins/**"
      - "native/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "source-overlay-1.0.16.zip"
      - ".github/workflows/android-apk.yml"




permissions:
  contents: read




jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35




    steps:
      - name: Check out source
        uses: actions/checkout@v4




      - name: Apply checked source overlay
        run: unzip -oq source-overlay-1.0.16.zip -d .




      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0




      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm




      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"




      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
