name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "work-*"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Verify and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(sed -nE 's/.*version:[[:space:]]*"([^"]+)".*/\1/p' app.config.ts | head -n1)
          VERSION_CODE=$(sed -nE 's/.*versionCode:[[:space:]]*([0-9]+).*/\1/p' app.config.ts | head -n1)
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          test "$VERSION" = "$VERSION_CODE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Reject an already used release version
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          TAG="v${{ steps.app_version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Release tag ${TAG} already exists. Increase the app version before publishing from main."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Refresh dependency lockfile on refactor branch
        if: github.ref == 'refs/heads/work-v140-refactor'
        shell: bash
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Refresh dependency lockfile [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Run unit tests
        run: pnpm test

      - name: Check TypeScript
        run: pnpm check

      - name: Run ESLint
        run: pnpm lint

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        run: cd android && ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare APK file
        shell: bash
        run: cp android/app/build/outputs/apk/release/app-release.apk "time-machine-${{ steps.app_version.outputs.version }}.apk"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: time-machine-${{ steps.app_version.outputs.version }}-${{ github.run_number }}
          path: time-machine-${{ steps.app_version.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: Машина времени v${{ steps.app_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: time-machine-${{ steps.app_version.outputs.version }}.apk
          generate_release_notes: true
